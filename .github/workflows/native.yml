name: Native platform validation

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      runner:
        required: true
        type: string

permissions:
  contents: read

jobs:
  native:
    name: Native ${{ inputs.arch }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config binutils jq
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: rust
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/${{ inputs.arch }}-unknown-linux-gnu
          key: native-${{ inputs.arch }}-${{ hashFiles('Cargo.lock', 'mise.toml') }}-${{ github.sha }}
          restore-keys: native-${{ inputs.arch }}-${{ hashFiles('Cargo.lock', 'mise.toml') }}-
      - name: Native source and optimized artifact verification
        run: |
          python3 scripts/tooling/cli.py setup --profile engine
          python3 scripts/tooling/cli.py test --scope engine
          python3 scripts/tooling/cli.py test integration --scope protocol
          bash scripts/build-engine-release.sh
          python3 scripts/tooling/release.py smoke target/dist/omastorm-engine-${{ inputs.arch }}-unknown-linux-gnu
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-native-${{ inputs.arch }}
          path: target/dist/omastorm-engine-${{ inputs.arch }}-unknown-linux-gnu*
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: native-${{ inputs.arch }}-logs
          path: target/evidence
          if-no-files-found: ignore
